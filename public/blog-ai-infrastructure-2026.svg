<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg26" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060a10"/>
      <stop offset="50%" style="stop-color:#080c14"/>
      <stop offset="100%" style="stop-color:#06080f"/>
    </linearGradient>
    <linearGradient id="stackGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1a2e"/>
      <stop offset="100%" style="stop-color:#0a1525"/>
    </linearGradient>
    <linearGradient id="stackGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a1f10"/>
      <stop offset="100%" style="stop-color:#0d2018"/>
    </linearGradient>
    <linearGradient id="stackGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a140a"/>
      <stop offset="100%" style="stop-color:#1a1205"/>
    </linearGradient>
    <linearGradient id="stackGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0e0a1a"/>
      <stop offset="100%" style="stop-color:#100a1e"/>
    </linearGradient>
    <linearGradient id="stackGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f1a0a"/>
      <stop offset="100%" style="stop-color:#0c1a10"/>
    </linearGradient>
    <linearGradient id="stackGrad6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="100%" style="stop-color:#1a0c10"/>
    </linearGradient>
    <radialGradient id="amberGlow26" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="cyanGlow26" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="centerGlow26" cx="50%" cy="40%" r="55%">
      <stop offset="0%" style="stop-color:#0d1a2e;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#060a10;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow-a26" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-c26" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur-heavy26">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blur-soft26">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="connLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f9fafb"/>
      <stop offset="60%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="675" fill="url(#bg26)"/>

  <!-- Ambient glows -->
  <ellipse cx="600" cy="337" rx="420" ry="280" fill="url(#centerGlow26)"/>
  <ellipse cx="200" cy="250" rx="260" ry="200" fill="url(#cyanGlow26)" filter="url(#blur-heavy26)" opacity="0.5"/>
  <ellipse cx="980" cy="420" rx="240" ry="180" fill="url(#amberGlow26)" filter="url(#blur-heavy26)" opacity="0.5"/>

  <!-- Grid lines - subtle background grid -->
  <g opacity="0.04" stroke="#a0aec0" stroke-width="1">
    <line x1="0" y1="112" x2="1200" y2="112"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="337" x2="1200" y2="337"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="562" x2="1200" y2="562"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- ── Infrastructure Stack — left panel ── -->
  <!-- Stack container -->
  <g transform="translate(80, 80)">

    <!-- Layer 6: Governance (top) -->
    <rect x="0" y="0" width="460" height="68" rx="6" fill="url(#stackGrad6)" stroke="rgba(239,68,68,0.25)" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="68" rx="2" fill="#ef4444" opacity="0.7"/>
    <text x="20" y="22" font-family="monospace" font-size="8" fill="#ef4444" opacity="0.7" letter-spacing="2">LAYER 06</text>
    <text x="20" y="42" font-family="Georgia, serif" font-size="15" fill="#f9fafb" font-weight="700">Security &amp; Governance</text>
    <text x="20" y="58" font-family="monospace" font-size="9" fill="rgba(156,163,175,0.7)" letter-spacing="1">access controls · compliance · audit trails</text>
    <!-- Status dots -->
    <circle cx="428" cy="24" r="4" fill="#ef4444" opacity="0.8" filter="url(#glow-a26)"/>
    <circle cx="444" cy="24" r="4" fill="#ef4444" opacity="0.4"/>

    <!-- Layer 5: Workflows -->
    <rect x="0" y="80" width="460" height="68" rx="6" fill="url(#stackGrad5)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
    <rect x="0" y="80" width="4" height="68" rx="2" fill="#22c55e" opacity="0.7"/>
    <text x="20" y="102" font-family="monospace" font-size="8" fill="#22c55e" opacity="0.7" letter-spacing="2">LAYER 05</text>
    <text x="20" y="122" font-family="Georgia, serif" font-size="15" fill="#f9fafb" font-weight="700">Workflow Integration</text>
    <text x="20" y="138" font-family="monospace" font-size="9" fill="rgba(156,163,175,0.7)" letter-spacing="1">orchestration · agents · automation pipelines</text>
    <circle cx="428" cy="104" r="4" fill="#22c55e" opacity="0.8" filter="url(#glow-a26)"/>
    <circle cx="444" cy="104" r="4" fill="#22c55e" opacity="0.4"/>

    <!-- Layer 4: Networking -->
    <rect x="0" y="160" width="460" height="68" rx="6" fill="url(#stackGrad4)" stroke="rgba(168,85,247,0.2)" stroke-width="1"/>
    <rect x="0" y="160" width="4" height="68" rx="2" fill="#a855f7" opacity="0.7"/>
    <text x="20" y="182" font-family="monospace" font-size="8" fill="#a855f7" opacity="0.7" letter-spacing="2">LAYER 04</text>
    <text x="20" y="202" font-family="Georgia, serif" font-size="15" fill="#f9fafb" font-weight="700">Fast Networking</text>
    <text x="20" y="218" font-family="monospace" font-size="9" fill="rgba(156,163,175,0.7)" letter-spacing="1">low-latency APIs · edge routing · CDN</text>
    <circle cx="428" cy="184" r="4" fill="#a855f7" opacity="0.8" filter="url(#glow-a26)"/>
    <circle cx="444" cy="184" r="4" fill="#a855f7" opacity="0.4"/>

    <!-- Layer 3: Storage -->
    <rect x="0" y="240" width="460" height="68" rx="6" fill="url(#stackGrad3)" stroke="rgba(251,191,36,0.22)" stroke-width="1"/>
    <rect x="0" y="240" width="4" height="68" rx="2" fill="#fbbf24" opacity="0.7"/>
    <text x="20" y="262" font-family="monospace" font-size="8" fill="#fbbf24" opacity="0.7" letter-spacing="2">LAYER 03</text>
    <text x="20" y="282" font-family="Georgia, serif" font-size="15" fill="#f9fafb" font-weight="700">Scalable Storage</text>
    <text x="20" y="298" font-family="monospace" font-size="9" fill="rgba(156,163,175,0.7)" letter-spacing="1">vector DBs · data lakes · object storage</text>
    <circle cx="428" cy="264" r="4" fill="#fbbf24" opacity="0.8" filter="url(#glow-a26)"/>
    <circle cx="444" cy="264" r="4" fill="#fbbf24" opacity="0.4"/>

    <!-- Layer 2: Compute -->
    <rect x="0" y="320" width="460" height="68" rx="6" fill="url(#stackGrad2)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
    <rect x="0" y="320" width="4" height="68" rx="2" fill="#06b6d4" opacity="0.7"/>
    <text x="20" y="342" font-family="monospace" font-size="8" fill="#06b6d4" opacity="0.7" letter-spacing="2">LAYER 02</text>
    <text x="20" y="362" font-family="Georgia, serif" font-size="15" fill="#f9fafb" font-weight="700">Reliable Compute</text>
    <text x="20" y="378" font-family="monospace" font-size="9" fill="rgba(156,163,175,0.7)" letter-spacing="1">GPU clusters · cloud · hybrid / edge</text>
