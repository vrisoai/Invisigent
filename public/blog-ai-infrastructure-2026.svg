    <text x="20" y="442" font-family="Georgia, serif" font-size="15" fill="#f9fafb" font-weight="700">Clean Data Pipelines</text>
    <text x="20" y="458" font-family="monospace" font-size="9" fill="rgba(156,163,175,0.7)" letter-spacing="1">ingestion · validation · transformation · lineage</text>
    <circle cx="428" cy="424" r="4" fill="#06b6d4" opacity="0.8" filter="url(#glow-c26)"/>
    <circle cx="444" cy="424" r="4" fill="#06b6d4" opacity="0.4"/>

    <!-- Foundation bar -->
    <rect x="0" y="478" width="460" height="6" rx="3" fill="url(#connLineGrad)" opacity="0.4"/>
  </g>

