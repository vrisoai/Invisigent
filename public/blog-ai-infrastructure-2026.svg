    <rect x="0" y="122" width="218" height="84" rx="6" fill="rgba(6,182,212,0.06)" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>
    <text x="14" y="146" font-family="monospace" font-size="8" fill="#06b6d4" letter-spacing="2" opacity="0.8">DATA QUALITY</text>
    <text x="14" y="168" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f9fafb">99.2%</text>
    <text x="14" y="188" font-family="monospace" font-size="9" fill="rgba(156,163,175,0.6)">validation pass rate</text>
    <!-- mini sparkline -->
    <polyline points="140,175 155,168 168,172 182,162 196,166 210,158" stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- Card 2 -->
    <rect x="232" y="122" width="218" height="84" rx="6" fill="rgba(251,191,36,0.05)" stroke="rgba(251,191,36,0.15)" stroke-width="1"/>
    <text x="14" y="146" font-family="monospace" font-size="8" fill="#fbbf24" letter-spacing="2" opacity="0.8" transform="translate(232,0)">INFERENCE LATENCY</text>
    <text x="14" y="168" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f9fafb" transform="translate(232,0)">148ms</text>
    <text x="14" y="188" font-family="monospace" font-size="9" fill="rgba(156,163,175,0.6)" transform="translate(232,0)">p95 end-to-end</text>
    <polyline points="374,175 386,172 398,168 410,171 420,165 440,162" stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- Card 3 -->
    <rect x="0" y="220" width="218" height="84" rx="6" fill="rgba(34,197,94,0.05)" stroke="rgba(34,197,94,0.15)" stroke-width="1"/>
    <text x="14" y="244" font-family="monospace" font-size="8" fill="#22c55e" letter-spacing="2" opacity="0.8">AGENT UPTIME</text>
    <text x="14" y="266" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f9fafb">99.97%</text>
    <text x="14" y="286" font-family="monospace" font-size="9" fill="rgba(156,163,175,0.6)">30-day rolling</text>
    <polyline points="140,272 155,270 168,274 182,268 196,271 210,266" stroke="#22c55e" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- Card 4 -->
    <rect x="232" y="220" width="218" height="84" rx="6" fill="rgba(168,85,247,0.05)" stroke="rgba(168,85,247,0.15)" stroke-width="1"/>
    <text x="14" y="244" font-family="monospace" font-size="8" fill="#a855f7" letter-spacing="2" opacity="0.8" transform="translate(232,0)">SCALE FACTOR</text>
    <text x="14" y="266" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f9fafb" transform="translate(232,0)">12×</text>
    <text x="14" y="286" font-family="monospace" font-size="9" fill="rgba(156,163,175,0.6)" transform="translate(232,0)">ops capacity vs. headcount</text>
    <polyline points="374,272 390,268 402,265 416,262 428,258 442,254" stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- Observability bar -->
    <rect x="0" y="320" width="450" height="56" rx="6" fill="rgba(251,191,36,0.04)" stroke="rgba(251,191,36,0.12)" stroke-width="1"/>
    <text x="14" y="342" font-family="monospace" font-size="8" fill="#fbbf24" letter-spacing="2" opacity="0.8">OBSERVABILITY PIPELINE — LIVE</text>
    <!-- animated-looking data flow bars -->
    <rect x="14" y="350" width="18" height="16" rx="2" fill="#fbbf24" opacity="0.7"/>
    <rect x="36" y="353" width="18" height="13" rx="2" fill="#fbbf24" opacity="0.5"/>
    <rect x="58" y="348" width="18" height="18" rx="2" fill="#fbbf24" opacity="0.65"/>
    <rect x="80" y="352" width="18" height="14" rx="2" fill="#fbbf24" opacity="0.45"/>
    <rect x="102" y="349" width="18" height="17" rx="2" fill="#06b6d4" opacity="0.6"/>
    <rect x="124" y="354" width="18" height="12" rx="2" fill="#06b6d4" opacity="0.4"/>
    <rect x="146" y="350" width="18" height="16" rx="2" fill="#22c55e" opacity="0.55"/>
    <rect x="168" y="352" width="18" height="14" rx="2" fill="#22c55e" opacity="0.45"/>
    <rect x="190" y="347" width="18" height="19" rx="2" fill="#fbbf24" opacity="0.6"/>
    <rect x="212" y="351" width="18" height="15" rx="2" fill="#fbbf24" opacity="0.5"/>
    <rect x="234" y="350" width="18" height="16" rx="2" fill="#a855f7" opacity="0.55"/>
    <rect x="256" y="354" width="18" height="12" rx="2" fill="#a855f7" opacity="0.4"/>
    <rect x="278" y="348" width="18" height="18" rx="2" fill="#06b6d4" opacity="0.6"/>
    <rect x="300" y="352" width="18" height="14" rx="2" fill="#fbbf24" opacity="0.5"/>
    <rect x="322" y="349" width="18" height="17" rx="2" fill="#22c55e" opacity="0.5"/>
    <rect x="344" y="350" width="18" height="16" rx="2" fill="#fbbf24" opacity="0.65"/>
    <rect x="366" y="353" width="18" height="13" rx="2" fill="#06b6d4" opacity="0.4"/>
    <rect x="388" y="348" width="18" height="18" rx="2" fill="#fbbf24" opacity="0.6"/>
    <rect x="410" y="351" width="18" height="15" rx="2" fill="#22c55e" opacity="0.45"/>
    <rect x="432" y="350" width="12" height="16" rx="2" fill="#a855f7" opacity="0.55"/>

    <!-- Bottom tag line -->
    <text x="0" y="420" font-family="Georgia, serif" font-size="13" fill="rgba(249,250,251,0.4)" font-style="italic">
      The foundation that makes AI useful in real operations.
    </text>

    <!-- Year badge -->
    <rect x="348" y="400" width="100" height="28" rx="4" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
    <text x="398" y="419" font-family="monospace" font-size="11" fill="#fbbf24" text-anchor="middle" letter-spacing="2" font-weight="700">2026</text>
  </g>

  <!-- Connector lines between stack and right panel -->
  <g opacity="0.15" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,6">
    <line x1="545" y1="114" x2="600" y2="200"/>
    <line x1="545" y1="194" x2="600" y2="262"/>
    <line x1="545" y1="274" x2="600" y2="304"/>
    <line x1="545" y1="354" x2="600" y2="362"/>
    <line x1="545" y1="434" x2="600" y2="400"/>
  </g>

  <!-- Top scanline effect -->
  <rect width="1200" height="2" y="0" fill="rgba(251,191,36,0.15)"/>
  <rect width="1200" height="1" y="672" fill="rgba(6,182,212,0.1)"/>

  <!-- Corner decorations -->
  <polyline points="20,20 20,40 40,40" stroke="rgba(251,191,36,0.4)" stroke-width="1.5" fill="none"/>
  <polyline points="1180,20 1180,40 1160,40" stroke="rgba(251,191,36,0.4)" stroke-width="1.5" fill="none"/>
  <polyline points="20,655 20,635 40,635" stroke="rgba(6,182,212,0.3)" stroke-width="1.5" fill="none"/>
  <polyline points="1180,655 1180,635 1160,635" stroke="rgba(6,182,212,0.3)" stroke-width="1.5" fill="none"/>

  <!-- Invisigent watermark -->
