<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Proxy for AI agents architecture: an AI agent routes traffic through a gateway layer — network proxy, LLM gateway and MCP tool gateway — to websites, model providers and tools, with a policy check that enforces limits">
  <defs>
    <linearGradient id="pxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070c10"/>
      <stop offset="50%" style="stop-color:#0a0d12"/>
      <stop offset="100%" style="stop-color:#0a0907"/>
    </linearGradient>
    <radialGradient id="pxAmberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.16"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="pxCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="pxGreenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="pxNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1b1b1b"/>
      <stop offset="100%" style="stop-color:#131313"/>
    </linearGradient>
    <marker id="pxArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(251,191,36,0.6)"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#pxBg)"/>
  <ellipse cx="600" cy="350" rx="300" ry="280" fill="url(#pxAmberGlow)"/>
  <ellipse cx="200" cy="350" rx="220" ry="240" fill="url(#pxCyanGlow)"/>
  <ellipse cx="1000" cy="350" rx="230" ry="250" fill="url(#pxGreenGlow)"/>

  <g opacity="0.045" stroke="#fbbf24" stroke-width="0.5">
    <line x1="0" y1="112" x2="1200" y2="112"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="338" x2="1200" y2="338"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="563" x2="1200" y2="563"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <text x="600" y="78" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="5" fill="#fbbf24" opacity="0.85">PROXY FOR AI AGENTS</text>
  <text x="600" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#f5f5f5">The agent decides. The gateway enforces.</text>

  <!-- Agent -->
  <rect x="80" y="270" width="210" height="140" rx="14" fill="url(#pxNode)" stroke="#06b6d4" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="185" y="320" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="3" fill="#06b6d4">AI AGENT</text>
  <text x="185" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#e5e5e5">reasons &amp; plans</text>
  <text x="185" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#e5e5e5">requests actions</text>

  <!-- Gateway layer -->
  <rect x="420" y="170" width="360" height="380" rx="18" fill="#0f0f0f" fill-opacity="0.9" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="600" y="205" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="4" fill="#fbbf24">GATEWAY LAYER</text>

  <rect x="450" y="225" width="300" height="70" rx="10" fill="url(#pxNode)" stroke="rgba(255,255,255,0.12)"/>
  <text x="600" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#f5f5f5">Network Proxy</text>
  <text x="600" y="279" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">IP · region · session · rate</text>

  <rect x="450" y="310" width="300" height="70" rx="10" fill="url(#pxNode)" stroke="rgba(255,255,255,0.12)"/>
  <text x="600" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#f5f5f5">LLM Gateway</text>
  <text x="600" y="364" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">keys · routing · fallback · cost</text>

  <rect x="450" y="395" width="300" height="70" rx="10" fill="url(#pxNode)" stroke="rgba(255,255,255,0.12)"/>
  <text x="600" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#f5f5f5">MCP / Tool Gateway</text>
  <text x="600" y="449" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">authz · policy · audit</text>

  <rect x="485" y="485" width="230" height="44" rx="22" fill="rgba(251,191,36,0.1)" stroke="#fbbf24" stroke-opacity="0.6"/>
  <text x="600" y="513" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#fbbf24">refund $90 &gt; limit $50 → DENY</text>

  <!-- Destinations -->
  <rect x="900" y="200" width="230" height="80" rx="12" fill="url(#pxNode)" stroke="#22c55e" stroke-opacity="0.5"/>
  <text x="1015" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#f5f5f5">Websites &amp; APIs</text>
  <text x="1015" y="259" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">search · pages · data</text>

  <rect x="900" y="300" width="230" height="80" rx="12" fill="url(#pxNode)" stroke="#22c55e" stroke-opacity="0.5"/>
  <text x="1015" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#f5f5f5">LLM Providers</text>
  <text x="1015" y="359" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">cloud · self-hosted</text>

  <rect x="900" y="400" width="230" height="80" rx="12" fill="url(#pxNode)" stroke="#22c55e" stroke-opacity="0.5"/>
  <text x="1015" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#f5f5f5">Tools &amp; MCP Servers</text>
  <text x="1015" y="459" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">GitHub · DB · payments</text>

  <!-- Arrows -->
  <g stroke="rgba(251,191,36,0.55)" stroke-width="1.6" fill="none" marker-end="url(#pxArrow)">
    <path d="M 290 340 L 412 340"/>
    <path d="M 750 260 C 830 260, 830 240, 892 240"/>
    <path d="M 750 345 L 892 340"/>
    <path d="M 750 430 C 830 430, 830 440, 892 440"/>
  </g>

  <text x="600" y="610" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#737373">one door · central policy · full audit trail</text>
</svg>
