  <text x="82" y="448" font-family="'Courier New', monospace" font-size="8" fill="#64748b" letter-spacing="2">FACT VERIFICATION</text>
  <text x="82" y="468" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Fact Check</text>
  <text x="82" y="488" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Cross-reference validation</text>
  <!-- Status pill -->
