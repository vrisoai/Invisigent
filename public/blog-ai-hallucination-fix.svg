  <text x="670" y="619" font-family="'Courier New', monospace" font-size="9" fill="#64748b" letter-spacing="1">SOURCES VERIFIED</text>
  <text x="670" y="635" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8b5cf6">18,903</text>

