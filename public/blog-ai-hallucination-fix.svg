  <rect x="60" y="318" width="1080" height="6" rx="3" fill="#1e3a5f" opacity="0.6"/>
  <rect x="60" y="318" width="1080" height="6" rx="3" fill="url(#pipeGrad)" opacity="0.5"/>

  <!-- Animated-style flow dots on pipeline -->
  <circle cx="120" cy="321" r="3" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>
  <circle cx="240" cy="321" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="360" cy="321" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="500" cy="321" r="3" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>
  <circle cx="620" cy="321" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="750" cy="321" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="900" cy="321" r="3" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>
  <circle cx="1040" cy="321" r="2" fill="#fbbf24" opacity="0.5"/>

  <!-- ===== NODE 1: LLM INPUT ===== -->
  <rect x="62" y="240" width="140" height="80" rx="8" fill="url(#cardGrad)" stroke="#2d3748" stroke-width="1.5"/>
  <rect x="62" y="240" width="140" height="3" rx="2" fill="#3b82f6" opacity="0.8"/>
  <text x="132" y="270" font-family="'Courier New', monospace" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="2">INPUT</text>
  <text x="132" y="291" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">LLM Query</text>
