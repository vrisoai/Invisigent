  <text x="766" y="448" font-family="'Courier New', monospace" font-size="8" fill="#64748b" letter-spacing="2">ALERTING</text>
  <text x="766" y="468" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Anomaly Alert</text>
  <text x="766" y="488" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Real-time drift detection</text>
  <rect x="766" y="498" width="76" height="14" rx="7" fill="#300a14" opacity="0.9"/>
  <circle cx="777" cy="505" r="3" fill="#f43f5e"/>
  <text x="786" y="509" font-family="'Courier New', monospace" font-size="8" fill="#f43f5e">WATCHING</text>

  <!-- Card: Audit Log -->
  <rect x="974" y="420" width="188" height="100" rx="8" fill="url(#cardGrad)" stroke="#1e2d3d" stroke-width="1.5"/>
