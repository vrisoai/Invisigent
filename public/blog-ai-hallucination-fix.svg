  <!-- Arrow down to pipeline -->
  <line x1="132" y1="320" x2="132" y2="320" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>

  <!-- ===== NODE 2: RAG PIPELINE ===== -->
  <rect x="255" y="225" width="155" height="95" rx="8" fill="url(#cardGrad)" stroke="#2d3748" stroke-width="1.5"/>
  <rect x="255" y="225" width="155" height="3" rx="2" fill="#8b5cf6" opacity="0.8"/>
  <text x="333" y="253" font-family="'Courier New', monospace" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="2">RETRIEVAL</text>
  <text x="333" y="274" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">RAG Pipeline</text>
  <!-- Mini doc icons -->
  <rect x="308" y="283" width="10" height="13" rx="1" fill="#8b5cf6" opacity="0.5"/>
  <rect x="322" y="283" width="10" height="13" rx="1" fill="#8b5cf6" opacity="0.5"/>
  <rect x="336" y="283" width="10" height="13" rx="1" fill="#8b5cf6" opacity="0.5"/>
  <rect x="350" y="283" width="10" height="13" rx="1" fill="#8b5cf6" opacity="0.5"/>

