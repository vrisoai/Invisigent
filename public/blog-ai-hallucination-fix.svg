  <line x1="333" y1="320" x2="333" y2="340" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5"/>
  <line x1="540" y1="357" x2="540" y2="321" stroke="#fbbf24" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <line x1="760" y1="320" x2="760" y2="340" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5"/>
