<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141520;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <clipPath id="svgClip">
      <rect width="1200" height="675"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Ambient glow spots -->
  <ellipse cx="200" cy="337" rx="300" ry="200" fill="#fbbf24" opacity="0.03"/>
  <ellipse cx="1000" cy="337" rx="300" ry="200" fill="#3b82f6" opacity="0.04"/>
  <ellipse cx="600" cy="337" rx="250" ry="180" fill="#fbbf24" opacity="0.04"/>

  <!-- Top border accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#amberGlow)" opacity="0.8"/>

  <!-- ===== HEADER SECTION ===== -->
  <!-- Main title -->
  <text x="600" y="58" font-family="'Courier New', Courier, monospace" font-size="11" fill="#fbbf24" opacity="0.7" text-anchor="middle" letter-spacing="4">INFRASTRUCTURE OVERVIEW</text>
  <text x="600" y="102" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">AI Hallucination Fix Infrastructure</text>
  <text x="600" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="1">Detection · Monitoring · Correction · Validation</text>

  <!-- Decorative title underline -->
  <line x1="440" y1="140" x2="760" y2="140" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
  <circle cx="440" cy="140" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="760" cy="140" r="2" fill="#fbbf24" opacity="0.6"/>

  <!-- ===== MAIN PIPELINE (center horizontal) ===== -->
