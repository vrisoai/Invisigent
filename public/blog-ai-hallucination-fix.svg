  <rect x="954" y="284" width="8" height="29" rx="2" fill="#f43f5e" opacity="0.5"/>
  <rect x="967" y="294" width="8" height="19" rx="2" fill="#f43f5e" opacity="0.6"/>
  <rect x="980" y="286" width="8" height="27" rx="2" fill="#10b981" opacity="0.7"/>
  <rect x="993" y="289" width="8" height="24" rx="2" fill="#10b981" opacity="0.5"/>
  <rect x="1006" y="292" width="8" height="21" rx="2" fill="#fbbf24" opacity="0.9"/>
  <rect x="1019" y="285" width="8" height="28" rx="2" fill="#10b981" opacity="0.6"/>
  <rect x="1032" y="290" width="8" height="23" rx="2" fill="#f43f5e" opacity="0.4"/>
  <rect x="1045" y="283" width="8" height="30" rx="2" fill="#fbbf24" opacity="0.7"/>

  <!-- ===== BOTTOM ROW: Metric cards ===== -->
  <!-- Card: Fact Check -->
  <rect x="62" y="420" width="200" height="100" rx="8" fill="url(#cardGrad)" stroke="#1e2d3d" stroke-width="1.5"/>
