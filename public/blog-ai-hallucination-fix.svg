  <circle cx="540" cy="295" r="72" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.2"/>
  <circle cx="540" cy="295" r="60" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.35"/>
  <!-- Shield background -->
  <path d="M540 228 L590 252 L590 295 Q590 335 540 355 Q490 335 490 295 L490 252 Z" fill="#1a1508" opacity="0.9"/>
  <path d="M540 228 L590 252 L590 295 Q590 335 540 355 Q490 335 490 295 L490 252 Z" fill="none" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/>
