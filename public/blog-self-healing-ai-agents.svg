<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Self-healing AI agent loop showing detect, diagnose, isolate, repair and learn stages with a human approval gate">
  <defs>
    <linearGradient id="shBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070c10"/>
      <stop offset="50%" style="stop-color:#080e0d"/>
      <stop offset="100%" style="stop-color:#0a0a07"/>
    </linearGradient>
    <radialGradient id="shCenterGlow" cx="50%" cy="52%" r="46%">
      <stop offset="0%" style="stop-color:#12210f;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#060a08;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="shAmberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.16"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="shCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.16"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="shGreenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.16"/>
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="shNodeFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1b1b1b"/>
      <stop offset="100%" style="stop-color:#131313"/>
    </linearGradient>
    <linearGradient id="shPanelFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#181818;stop-opacity:0.94"/>
      <stop offset="100%" style="stop-color:#0f0f0f;stop-opacity:0.94"/>
    </linearGradient>
    <filter id="shGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shSoftGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="shArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(251,191,36,0.5)"/>
    </marker>
    <marker id="shArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(34,197,94,0.55)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#shBg)"/>
  <rect width="1200" height="675" fill="url(#shCenterGlow)"/>
  <ellipse cx="600" cy="350" rx="330" ry="300" fill="url(#shAmberGlow)"/>
  <ellipse cx="185" cy="350" rx="230" ry="260" fill="url(#shCyanGlow)"/>
  <ellipse cx="1015" cy="350" rx="230" ry="260" fill="url(#shGreenGlow)"/>

  <!-- Grid -->
  <g opacity="0.045" stroke="#fbbf24" stroke-width="0.5">
    <line x1="0" y1="112" x2="1200" y2="112"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="338" x2="1200" y2="338"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="563" x2="1200" y2="563"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Content, centred vertically so the 21:9 hero crop shows the whole composition -->
  <g transform="translate(0,40)">

  <!-- Header label -->
  <text x="60" y="62" fill="#fbbf24" font-size="11" font-family="monospace" font-weight="700" letter-spacing="4">SELF-HEALING AI AGENTS</text>
  <text x="60" y="82" fill="#8a8a8a" font-size="9.5" font-family="monospace" letter-spacing="1.5">CLOSED-LOOP DETECTION &#8594; DIAGNOSIS &#8594; REPAIR, WITH A HUMAN IN THE APPROVAL PATH</text>
  <line x1="60" y1="96" x2="1140" y2="96" stroke="rgba(251,191,36,0.14)" stroke-width="0.75"/>

  <!-- LEFT PANEL: production signals -->
  <rect x="60" y="132" width="248" height="412" rx="12" fill="url(#shPanelFill)" stroke="rgba(6,182,212,0.22)" stroke-width="1"/>
  <text x="80" y="162" fill="#22d3ee" font-size="9" font-family="monospace" font-weight="700" letter-spacing="2.4">PRODUCTION TRACES</text>
  <line x1="80" y1="174" x2="288" y2="174" stroke="rgba(6,182,212,0.16)" stroke-width="0.6"/>

  <g font-family="monospace">
    <circle cx="88" cy="198" r="3.5" fill="#f87171"/>
    <text x="102" y="201" fill="#e5e5e5" font-size="8.5">tool_timeout</text>
    <text x="288" y="201" fill="#f87171" font-size="8" text-anchor="end">214</text>
    <line x1="80" y1="212" x2="288" y2="212" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>

    <circle cx="88" cy="234" r="3.5" fill="#f87171"/>
    <text x="102" y="237" fill="#e5e5e5" font-size="8.5">malformed_json</text>
    <text x="288" y="237" fill="#f87171" font-size="8" text-anchor="end">137</text>
    <line x1="80" y1="248" x2="288" y2="248" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>

    <circle cx="88" cy="270" r="3.5" fill="#fbbf24"/>
    <text x="102" y="273" fill="#e5e5e5" font-size="8.5">ambiguous_prompt</text>
    <text x="288" y="273" fill="#fbbf24" font-size="8" text-anchor="end">92</text>
    <line x1="80" y1="284" x2="288" y2="284" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>

    <circle cx="88" cy="306" r="3.5" fill="#fbbf24"/>
    <text x="102" y="309" fill="#e5e5e5" font-size="8.5">context_lost</text>
    <text x="288" y="309" fill="#fbbf24" font-size="8" text-anchor="end">61</text>
    <line x1="80" y1="320" x2="288" y2="320" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>

    <circle cx="88" cy="342" r="3.5" fill="#a855f7"/>
    <text x="102" y="345" fill="#e5e5e5" font-size="8.5">step_bottleneck</text>
    <text x="288" y="345" fill="#a855f7" font-size="8" text-anchor="end">38</text>
  </g>

  <!-- Observability sources -->
  <line x1="80" y1="368" x2="288" y2="368" stroke="rgba(6,182,212,0.14)" stroke-width="0.6"/>
  <text x="80" y="390" fill="#22d3ee" font-size="8.5" font-family="monospace" font-weight="700" letter-spacing="2">TRACE SOURCES</text>
  <rect x="80" y="402" width="96" height="26" rx="5" fill="#151515" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
  <text x="128" y="419" fill="#93c5fd" font-size="8" font-family="monospace" text-anchor="middle">LangSmith</text>
  <rect x="188" y="402" width="100" height="26" rx="5" fill="#151515" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
  <text x="238" y="419" fill="#93c5fd" font-size="8" font-family="monospace" text-anchor="middle">Langfuse</text>

  <!-- Context engineering strip -->
  <rect x="80" y="444" width="208" height="80" rx="8" fill="rgba(6,182,212,0.04)" stroke="rgba(6,182,212,0.16)" stroke-width="1"/>
  <text x="94" y="464" fill="#22d3ee" font-size="8" font-family="monospace" font-weight="700" letter-spacing="1.6">CONTEXT ENGINEERING</text>
  <text x="94" y="481" fill="#9a9a9a" font-size="7.5" font-family="monospace">summarize &#183; condense &#183; prune</text>
  <text x="94" y="496" fill="#9a9a9a" font-size="7.5" font-family="monospace">semantic memory retrieval</text>
  <rect x="94" y="504" width="180" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="94" y="504" width="126" height="6" rx="3" fill="rgba(6,182,212,0.45)"/>
  <text x="274" y="510" fill="#22d3ee" font-size="6.5" font-family="monospace" text-anchor="end">70%</text>

  <!-- Left panel to loop -->
  <path d="M 308 338 L 386 338" stroke="rgba(251,191,36,0.35)" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#shArrow)"/>
  <text x="347" y="330" fill="#8a8a8a" font-size="7" font-family="monospace" text-anchor="middle">signals</text>

  <!-- CENTER: five-stage healing loop -->
  <circle cx="600" cy="348" r="142" fill="none" stroke="rgba(251,191,36,0.18)" stroke-width="1.2" stroke-dasharray="5,5"/>
  <circle cx="600" cy="348" r="142" fill="none" stroke="rgba(251,191,36,0.06)" stroke-width="14"/>

  <!-- direction arrowheads along the loop -->
  <g fill="rgba(251,191,36,0.45)">
    <path d="M -5 -4 L 5 0 L -5 4 Z" transform="translate(683,233) rotate(36)"/>
    <path d="M -5 -4 L 5 0 L -5 4 Z" transform="translate(735,392) rotate(108)"/>
    <path d="M -5 -4 L 5 0 L -5 4 Z" transform="translate(600,490) rotate(180)"/>
    <path d="M -5 -4 L 5 0 L -5 4 Z" transform="translate(465,392) rotate(252)"/>
    <path d="M -5 -4 L 5 0 L -5 4 Z" transform="translate(516,233) rotate(324)"/>
  </g>

  <!-- hub -->
  <g filter="url(#shSoftGlow)">
    <circle cx="600" cy="348" r="52" fill="#141712" stroke="rgba(251,191,36,0.45)" stroke-width="1.5"/>
    <circle cx="600" cy="348" r="52" fill="rgba(251,191,36,0.04)"/>
  </g>
  <text x="600" y="338" fill="#fbbf24" font-size="9.5" font-family="monospace" font-weight="700" text-anchor="middle" letter-spacing="1.4">HEALING</text>
  <text x="600" y="352" fill="#fbbf24" font-size="9.5" font-family="monospace" font-weight="700" text-anchor="middle" letter-spacing="1.4">LOOP</text>
  <text x="600" y="368" fill="#8a8a8a" font-size="7" font-family="monospace" text-anchor="middle">closed &#183; continuous</text>

  <!-- Stage 01 DETECT -->
  <g filter="url(#shGlow)">
    <rect x="544" y="180" width="112" height="52" rx="9" fill="url(#shNodeFill)" stroke="rgba(6,182,212,0.5)" stroke-width="1.4"/>
  </g>
  <text x="558" y="199" fill="#22d3ee" font-size="7" font-family="monospace" font-weight="700">01</text>
  <text x="600" y="203" fill="#e5e5e5" font-size="9.5" font-family="monospace" font-weight="700" text-anchor="middle">DETECT</text>
  <text x="600" y="219" fill="#8a8a8a" font-size="7" font-family="monospace" text-anchor="middle">anomalies &#183; errors</text>

  <!-- Stage 02 DIAGNOSE -->
  <g filter="url(#shGlow)">
    <rect x="679" y="278" width="112" height="52" rx="9" fill="url(#shNodeFill)" stroke="rgba(251,191,36,0.5)" stroke-width="1.4"/>
  </g>
  <text x="693" y="297" fill="#fbbf24" font-size="7" font-family="monospace" font-weight="700">02</text>
  <text x="735" y="301" fill="#e5e5e5" font-size="9.5" font-family="monospace" font-weight="700" text-anchor="middle">DIAGNOSE</text>
  <text x="735" y="317" fill="#8a8a8a" font-size="7" font-family="monospace" text-anchor="middle">root cause</text>

  <!-- Stage 03 ISOLATE -->
  <g filter="url(#shGlow)">
    <rect x="627" y="437" width="112" height="52" rx="9" fill="url(#shNodeFill)" stroke="rgba(168,85,247,0.5)" stroke-width="1.4"/>
  </g>
  <text x="641" y="456" fill="#a855f7" font-size="7" font-family="monospace" font-weight="700">03</text>
  <text x="683" y="460" fill="#e5e5e5" font-size="9.5" font-family="monospace" font-weight="700" text-anchor="middle">ISOLATE</text>
  <text x="683" y="476" fill="#8a8a8a" font-size="7" font-family="monospace" text-anchor="middle">stop cascade</text>

  <!-- Stage 04 REPAIR -->
  <g filter="url(#shGlow)">
    <rect x="460" y="437" width="112" height="52" rx="9" fill="url(#shNodeFill)" stroke="rgba(34,197,94,0.5)" stroke-width="1.4"/>
  </g>
  <text x="474" y="456" fill="#22c55e" font-size="7" font-family="monospace" font-weight="700">04</text>
  <text x="516" y="460" fill="#e5e5e5" font-size="9.5" font-family="monospace" font-weight="700" text-anchor="middle">REPAIR</text>
  <text x="516" y="476" fill="#8a8a8a" font-size="7" font-family="monospace" text-anchor="middle">prompt &#183; config</text>

  <!-- Stage 05 LEARN -->
  <g filter="url(#shGlow)">
    <rect x="409" y="278" width="112" height="52" rx="9" fill="url(#shNodeFill)" stroke="rgba(147,197,253,0.5)" stroke-width="1.4"/>
  </g>
  <text x="423" y="297" fill="#93c5fd" font-size="7" font-family="monospace" font-weight="700">05</text>
  <text x="465" y="301" fill="#e5e5e5" font-size="9.5" font-family="monospace" font-weight="700" text-anchor="middle">LEARN</text>
  <text x="465" y="317" fill="#8a8a8a" font-size="7" font-family="monospace" text-anchor="middle">feed incident back</text>

  <!-- Agent trio strip -->
  <text x="600" y="508" fill="#fbbf24" font-size="8" font-family="monospace" font-weight="700" text-anchor="middle" letter-spacing="2.2">MULTI-AGENT ARCHITECTURE</text>
  <rect x="386" y="516" width="132" height="38" rx="6" fill="#151515" stroke="rgba(6,182,212,0.28)" stroke-width="1"/>
  <text x="452" y="532" fill="#22d3ee" font-size="8" font-family="monospace" font-weight="700" text-anchor="middle">INSIGHTS AGENT</text>
  <text x="452" y="545" fill="#7f7f7f" font-size="6.8" font-family="monospace" text-anchor="middle">reads traces &#183; memory</text>

  <rect x="530" y="516" width="140" height="38" rx="6" fill="#151515" stroke="rgba(34,197,94,0.28)" stroke-width="1"/>
  <text x="600" y="532" fill="#4ade80" font-size="8" font-family="monospace" font-weight="700" text-anchor="middle">EVOLUTION AGENT</text>
  <text x="600" y="545" fill="#7f7f7f" font-size="6.8" font-family="monospace" text-anchor="middle">drafts prompt edits</text>

  <rect x="682" y="516" width="132" height="38" rx="6" fill="#151515" stroke="rgba(168,85,247,0.28)" stroke-width="1"/>
  <text x="748" y="532" fill="#c084fc" font-size="8" font-family="monospace" font-weight="700" text-anchor="middle">ROUTING AGENT</text>
  <text x="748" y="545" fill="#7f7f7f" font-size="6.8" font-family="monospace" text-anchor="middle">analyze or optimize</text>

  <!-- Repair to approval gate -->
  <path d="M 792 348 L 878 348" stroke="rgba(34,197,94,0.4)" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#shArrowGreen)"/>
  <text x="835" y="340" fill="#8a8a8a" font-size="7" font-family="monospace" text-anchor="middle">proposed diff</text>

  <!-- RIGHT PANEL: human approval gate -->
  <rect x="892" y="132" width="248" height="412" rx="12" fill="url(#shPanelFill)" stroke="rgba(34,197,94,0.24)" stroke-width="1"/>
  <text x="912" y="162" fill="#4ade80" font-size="9" font-family="monospace" font-weight="700" letter-spacing="2.2">HUMAN APPROVAL GATE</text>
  <line x1="912" y1="174" x2="1120" y2="174" stroke="rgba(34,197,94,0.16)" stroke-width="0.6"/>
  <text x="912" y="192" fill="#8a8a8a" font-size="7.5" font-family="monospace">execution paused &#183; awaiting review</text>

  <!-- Diff viewer -->
  <rect x="912" y="204" width="208" height="164" rx="7" fill="#101010" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="924" y="222" fill="#7f7f7f" font-size="7" font-family="monospace">prompts/support_agent.md</text>
  <line x1="912" y1="230" x2="1120" y2="230" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

  <rect x="912" y="238" width="208" height="16" fill="rgba(248,113,113,0.09)"/>
  <text x="924" y="250" fill="#f87171" font-size="7.5" font-family="monospace">- Answer the user question.</text>

  <rect x="912" y="256" width="208" height="16" fill="rgba(248,113,113,0.09)"/>
  <text x="924" y="268" fill="#f87171" font-size="7.5" font-family="monospace">- Use tools if needed.</text>

  <rect x="912" y="278" width="208" height="16" fill="rgba(34,197,94,0.1)"/>
  <text x="924" y="290" fill="#4ade80" font-size="7.5" font-family="monospace">+ Answer only from context.</text>

  <rect x="912" y="296" width="208" height="16" fill="rgba(34,197,94,0.1)"/>
  <text x="924" y="308" fill="#4ade80" font-size="7.5" font-family="monospace">+ Retry tool once on timeout.</text>

  <rect x="912" y="314" width="208" height="16" fill="rgba(34,197,94,0.1)"/>
  <text x="924" y="326" fill="#4ade80" font-size="7.5" font-family="monospace">+ Return strict JSON schema.</text>

  <rect x="912" y="332" width="208" height="16" fill="rgba(34,197,94,0.1)"/>
  <text x="924" y="344" fill="#4ade80" font-size="7.5" font-family="monospace">+ Say &quot;unknown&quot; if unsure.</text>

  <text x="924" y="362" fill="#4ade80" font-size="7.5" font-family="monospace">+4</text>
  <text x="952" y="362" fill="#f87171" font-size="7.5" font-family="monospace">-2</text>
  <text x="1108" y="362" fill="#7f7f7f" font-size="7" font-family="monospace" text-anchor="end">lines changed</text>

  <!-- Approve / discard -->
  <rect x="912" y="384" width="100" height="30" rx="6" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.45)" stroke-width="1.2"/>
  <text x="962" y="403" fill="#4ade80" font-size="8.5" font-family="monospace" font-weight="700" text-anchor="middle">APPROVE</text>
  <rect x="1020" y="384" width="100" height="30" rx="6" fill="rgba(248,113,113,0.08)" stroke="rgba(248,113,113,0.35)" stroke-width="1.2"/>
  <text x="1070" y="403" fill="#f87171" font-size="8.5" font-family="monospace" font-weight="700" text-anchor="middle">DISCARD</text>

  <!-- Status rows -->
  <line x1="912" y1="432" x2="1120" y2="432" stroke="rgba(34,197,94,0.14)" stroke-width="0.6"/>
  <g font-family="monospace">
    <circle cx="920" cy="454" r="3.5" fill="#4ade80"/>
    <text x="934" y="457" fill="#c9c9c9" font-size="8">analysis automated</text>
    <circle cx="920" cy="480" r="3.5" fill="#4ade80"/>
    <text x="934" y="483" fill="#c9c9c9" font-size="8">change reversible</text>
    <circle cx="920" cy="506" r="3.5" fill="#fbbf24"/>
    <text x="934" y="509" fill="#c9c9c9" font-size="8">shipping decision: human</text>
  </g>

  <!-- Return path: approved fix feeds back into production -->
  <path d="M 888 535 L 820 535" stroke="rgba(34,197,94,0.3)" stroke-width="1.3" stroke-dasharray="5,4" fill="none" marker-end="url(#shArrowGreen)"/>
  <text x="1016" y="530" fill="#6f6f6f" font-size="7.5" font-family="monospace" text-anchor="middle">approved fix redeployed &#8594; fed back into LEARN</text>

  </g>
</svg>
