<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Anthropic Scion architecture: thin scn clients and agents fetch trees and blobs on demand through a node daemon, regional scion-cache, and scion-server backed by Spanner and blob storage, with merges rising from 2,500 to 30,000 per day">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070c10"/>
      <stop offset="50%" style="stop-color:#0a0d12"/>
      <stop offset="100%" style="stop-color:#0a0907"/>
    </linearGradient>
    <radialGradient id="scAmberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="scCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="scGreenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="scNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1b1b1b"/>
      <stop offset="100%" style="stop-color:#131313"/>
    </linearGradient>
    <marker id="scArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(251,191,36,0.6)"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#scBg)"/>
  <ellipse cx="620" cy="360" rx="320" ry="270" fill="url(#scAmberGlow)"/>
  <ellipse cx="190" cy="360" rx="220" ry="240" fill="url(#scCyanGlow)"/>
  <ellipse cx="1010" cy="360" rx="220" ry="240" fill="url(#scGreenGlow)"/>

  <g opacity="0.045" stroke="#fbbf24" stroke-width="0.5">
    <line x1="0" y1="112" x2="1200" y2="112"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="338" x2="1200" y2="338"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="563" x2="1200" y2="563"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <text x="600" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="5" fill="#fbbf24" opacity="0.85">ANTHROPIC SCION</text>
  <text x="600" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#f5f5f5">Source control rebuilt for AI agents</text>

  <!-- Clients -->
  <g font-family="ui-monospace, Menlo, monospace">
    <rect x="70" y="200" width="200" height="62" rx="10" fill="url(#scNode)" stroke="#06b6d4" stroke-opacity="0.5"/>
    <text x="170" y="237" text-anchor="middle" font-size="14" fill="#e5e5e5">Claude agents</text>
    <rect x="70" y="282" width="200" height="62" rx="10" fill="url(#scNode)" stroke="#06b6d4" stroke-opacity="0.5"/>
    <text x="170" y="319" text-anchor="middle" font-size="14" fill="#e5e5e5">CI · 25M checkouts/day</text>
    <rect x="70" y="364" width="200" height="62" rx="10" fill="url(#scNode)" stroke="#06b6d4" stroke-opacity="0.5"/>
    <text x="170" y="401" text-anchor="middle" font-size="14" fill="#e5e5e5">Engineers · scn</text>
    <text x="170" y="460" text-anchor="middle" font-size="12" fill="#06b6d4">thin · always online · sparse</text>
  </g>

  <!-- Tiers -->
  <g font-family="Georgia, serif">
    <rect x="380" y="190" width="220" height="70" rx="12" fill="url(#scNode)" stroke="rgba(255,255,255,0.14)"/>
    <text x="490" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#f5f5f5">scion-daemon</text>
    <text x="490" y="245" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">per-node object store</text>

    <rect x="380" y="290" width="220" height="70" rx="12" fill="url(#scNode)" stroke="rgba(255,255,255,0.14)"/>
    <text x="490" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#f5f5f5">scion-cache</text>
    <text x="490" y="345" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">regional · &gt;99% hit rate</text>

    <rect x="380" y="390" width="220" height="70" rx="12" fill="url(#scNode)" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="490" y="422" text-anchor="middle" font-size="18" font-weight="700" fill="#f5f5f5">scion-server</text>
    <text x="490" y="445" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">merge · rebase · blame</text>

    <rect x="680" y="390" width="200" height="70" rx="12" fill="url(#scNode)" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="780" y="422" text-anchor="middle" font-size="18" font-weight="700" fill="#f5f5f5">Spanner + Blobs</text>
    <text x="780" y="445" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">changesets · derived data</text>
  </g>

  <g stroke="rgba(251,191,36,0.55)" stroke-width="1.6" fill="none" marker-end="url(#scArrow)">
    <path d="M 270 313 L 372 236"/>
    <path d="M 490 260 L 490 284"/>
    <path d="M 490 360 L 490 384"/>
    <path d="M 600 425 L 672 425"/>
  </g>

  <!-- Stats -->
  <g font-family="Georgia, serif">
    <rect x="930" y="180" width="210" height="84" rx="12" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-opacity="0.4"/>
    <text x="1035" y="220" text-anchor="middle" font-size="26" font-weight="700" fill="#fbbf24">2.5K → 30K</text>
    <text x="1035" y="246" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">merges per day</text>

    <rect x="930" y="280" width="210" height="84" rx="12" fill="rgba(34,197,94,0.06)" stroke="#22c55e" stroke-opacity="0.4"/>
    <text x="1035" y="320" text-anchor="middle" font-size="26" font-weight="700" fill="#22c55e">200× smaller</text>
    <text x="1035" y="346" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">CPU + memory vs git mirrors</text>

    <rect x="930" y="380" width="210" height="84" rx="12" fill="rgba(6,182,212,0.06)" stroke="#06b6d4" stroke-opacity="0.4"/>
    <text x="1035" y="420" text-anchor="middle" font-size="26" font-weight="700" fill="#06b6d4">min → sec</text>
    <text x="1035" y="446" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a3a3a3">checkout time</text>
  </g>

  <text x="600" y="580" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#737373">no pushes · no packfiles · no global merge lock · 7 engineers · 5 months</text>
</svg>
